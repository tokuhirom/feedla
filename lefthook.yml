pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true

    - name: golangci-lint
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD ./...

    - name: web-typecheck
      glob: "web/**/*.{ts,tsx}"
      run: cd web && mise exec pnpm -- pnpm run typecheck
